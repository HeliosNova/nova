services:
  ollama:
    image: ollama/ollama:0.32.15
    container_name: nova-ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_MAX_LOADED_MODELS: "3"
      OLLAMA_FLASH_ATTENTION: "1"
      # Q8 K/V cache ≈ halves KV-cache VRAM at <0.1% quality loss (needs flash-attn,
      # which is on above). Frees headroom for a side process + lets us hold more
      # grounding context. q8_0 is the safe choice — do NOT Q4 the V-cache (quality
      # drop). (owner 2026-07-01: GPU headroom + richer context.)
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_KEEP_ALIVE: "24h"
      # Default load timeout is 5m. A 27B Q4 (~17GB) loading fully onto the GPU
      # from this volume's disk takes ~10m; 20m gives headroom. Once loaded,
      # KEEP_ALIVE holds it resident so the slow load is a one-time cost.
      OLLAMA_LOAD_TIMEOUT: "20m"
      # NEW_ENGINE=true is the settled production state (enabled 2026-06-30;
      # the old engine silently ignored OLLAMA_NUM_PARALLEL for qwen35).
      OLLAMA_NEW_ENGINE: "true"
      # NEW_ENGINE=true honors NUM_PARALLEL for qwen35; old engine silently
      # ignored it. NUM_PARALLEL slots each carve out their own KV-cache VRAM and
      # SPLIT the context budget, so 4 both multiplied VRAM pressure and starved
      # each generation of context. Set to 1 (owner 2026-06-30: leave GPU headroom
      # for a side process): one generation at a time gets the FULL context and the
      # smallest VRAM footprint. Monitors/best-of-N still run — they just queue.
      OLLAMA_NUM_PARALLEL: "1"
      # OLLAMA_NUM_CTX is the default context for any request that doesn't pass
      # num_ctx explicitly. At 32768 a stray no-ctx call (e.g. the report grader)
      # loaded the 27B with a ~6GB KV cache → 185 MiB free on the whole GPU
      # (measured 2026-07-06) — zero headroom for the owner's side processes.
      # 16384 halves the worst-case stray load; the monitor synthesis chain pins
      # num_ctx=12288 per call and chat never needs 32K. (owner: more headroom)
      OLLAMA_NUM_CTX: "16384"
      # Hard VRAM reserve for the owner's side processes (owner 2026-07-06: "a bit
      # more headroom"). Ollama plans model loads as if this much VRAM doesn't
      # exist, auto-offloading a few 27B layers to CPU when needed — the ctx cap
      # alone left only ~1.2 GB free (27B is a ~23 GB resident). Cost: ~15-25%
      # slower 27B generation, which only affects latency-tolerant monitors.
      # 3 GiB = 3221225472 bytes.
      OLLAMA_GPU_OVERHEAD: "3221225472"
      # Required models (pull manually or via entrypoint):
      #   nova-ft            (production chat model — 9B fine-tune tag)
      #   qwen3.8:27b        (monitor digest synthesis, via MONITOR_SYNTHESIS_MODEL)
      #   gemma4:e4b         (independent judge — JUDGE_MODEL)
      #   qwen3.5:9b         (vision model; also nova-ft's base family)
      #   bge-m3             (embedder — pulled on the `embed` CPU instance)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 32g
    volumes:
      - ollama_data:/root/.ollama
      # - C:/data/finetune/merged:/finetune-model:ro  # Temp mount for model import
    healthcheck:
      # `ollama list` alone passes whenever the CLI responds, even if the
      # production model failed to register or was deleted. Grep for the
      # expected production model so a missing/corrupt registry trips the
      # healthcheck. Accepts either nova-ft (fine-tuned) or a qwen3 base —
      # both are valid working states. Real inference probing happens from
      # nova-app via the `Ollama Latency Monitor` heartbeat, since the
      # Ollama image has no curl/wget/python for in-container API probes.
      test: ["CMD-SHELL", "ollama list | grep -q '^nova-ft' || ollama list | grep -q '^qwen3'"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Dedicated CPU-only Ollama for EMBEDDINGS (bge-m3). Isolating embeds onto
  # their own instance + request queue means a query embed never waits behind a
  # 27B generation on the main GPU instance (NUM_PARALLEL=1 there serialized
  # them → the chat context-gather timed out; manual audit 2026-07-09). No GPU
  # reservation = CPU inference; bge-m3 is small (~1.2GB) so CPU embeds are fast
  # (~100-300ms) and never touch VRAM.
  embed:
    image: ollama/ollama:0.30.11
    container_name: nova-embed
    environment:
      OLLAMA_KEEP_ALIVE: "24h"      # keep bge-m3 resident
      OLLAMA_NUM_PARALLEL: "4"      # cheap CPU embeds — allow concurrency
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - embed_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q '^bge-m3'"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 4g
    cpus: 4.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  nova:
    build: .
    image: nova-app:latest
    container_name: nova-app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      searxng:
        condition: service_healthy
    # env_file passes LLM_PROVIDER, API keys, DISCORD_TOKEN, TELEGRAM_TOKEN, etc.
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
      EMBED_OLLAMA_URL: http://embed:11434
      SEARXNG_URL: http://searxng:8080
      MINICHECK_URL: http://minicheck:8080
      # Independent cross-family grounded judge (reflexion + output-eval).
      # A/B 2026-07-08 (4 real digests, ref=qwen3.6:27b): gemma4:e4b was
      # schema-valid 4/4 with 0.625 mean RACE error vs the documented gemma3:4b
      # at 1/4 valid / 1.75 error — gemma3:4b silently floored 75% of grades.
      # Fits beside the 9B during chat (27B is latch-deferred); critique_response
      # falls back to self-critique on any judge failure, so this is safe.
      JUDGE_MODEL: gemma4:e4b
      DB_PATH: /data/nova.db
      CHROMADB_PATH: /data/chromadb
      ANONYMIZED_TELEMETRY: "false"
      TRAINING_DATA_PATH: /data/training_data.jsonl
      MCP_CONFIG_DIR: /data/mcp
      ENABLE_SHELL_EXEC: "true"
      XDG_CACHE_HOME: /tmp/.cache
      DISPLAY: ":99"  # Xvfb virtual display for desktop automation
      XAUTHORITY: /tmp/.Xauthority
      ENABLE_DESKTOP_AUTOMATION: "true"
      ENABLE_PLANNING: "true"
      ENABLE_CRITIQUE: "true"
      # MCP: expose Nova as MCP server (for Claude Code/Cursor) and consume
      # external MCP tools. (Auto-finetune text removed 2026-08-25: the
      # training stack was archived 2026-06-12 — no runtime pathway exists;
      # manual fine-tuning runs from the host via archive/training/.)
      ENABLE_MCP: "true"
      ENABLE_MCP_SERVER: "true"
      # Voice: Whisper STT + Piper TTS (both already installed in image).
      ENABLE_VOICE: "true"
      ENABLE_TTS: "true"
      # Eval-suite per-task timeouts were sized for the 9B base. Production
      # runs the 9B nova-ft, so 1.5× is enough headroom (nova-ft + tool calls
      # run a bit slower than the bare 9B). Raise to 2.5 only when a 27B base
      # is loaded — at 2.5 a runaway task can burn 300s before failing.
      EVAL_TIMEOUT_MULTIPLIER: "1.5"
    volumes:
      - nova_data:/data
      - ./mcp:/data/mcp:ro
      # Off-volume backup target: daily verified snapshots are copied here
      # so they survive loss/corruption of the nova_data volume itself.
      # Lives on the host filesystem next to the compose tree (gitignored).
      - ./backups:/backups
      # True OFFSITE leg on a different physical drive (2026-08-14): the E:
      # mirror was fed by a one-shot manual robocopy — the daily leg silently
      # didn't exist. Maintenance now copies+verifies snapshots here directly.
      - "E:/nova-offsite:/offsite"
      # Job hand-off to the network-isolated exec sidecar (audit 2026-07-08).
      # Presence of this mount routes code_exec through nova-exec.
      - exec_queue:/exec_queue
      # /home/nova/.cache as tmpfs mounted with mode 1777 so nova (uid 1000)
      # can write ChromaDB's internal cache. Short-form tmpfs defaults to mode
      # 755/root — use long-form volume syntax instead.
      - type: tmpfs
        target: /home/nova/.cache
        tmpfs:
          size: 536870912
          mode: 1023  # 01777 octal = 1023 decimal (world-writable + sticky)
      # Uncomment for desktop automation (requires X11 on host):
      # - /tmp/.X11-unix:/tmp/.X11-unix:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: 4.0
    # Fork-bomb backstop (audit 2026-08-22): custom_tools can exec model-authored
    # code in-process here (code_exec/code_verify route to the network-isolated
    # sidecar, but custom_tools does not). Steady state is ~186 tasks; 4096 leaves
    # ample room for the chromium/Xvfb process tree while capping a runaway fork.
    pids_limit: 4096
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    image: nova-frontend:latest
    container_name: nova-frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      nova:
        condition: service_healthy
    environment:
      # Browser-accessible URL (not internal docker network name)
      VITE_API_URL: http://localhost:8000
      # Allow internal Docker hostnames for inter-container access
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: nova-frontend
    volumes:
      - ./frontend/src:/app/src        # hot-reload source changes
      - ./frontend/index.html:/app/index.html
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      # node-only image (no curl/wget): probe the Vite dev server over HTTP so a
      # silently-crashed dev server surfaces as unhealthy instead of "running"
      # (audit 2026-08-22).
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  minicheck:
    build:
      context: .
      dockerfile: Dockerfile.minicheck
    image: nova-minicheck:latest
    container_name: nova-minicheck
    # CPU-only entailment verifier (#48) — the GPU is committed to the 27B +
    # the owner's reserve. No published ports: nova-app reaches it on the
    # internal network at http://minicheck:8080. Fail-open by design: if this
    # service is down, the entailment gate in deep_research skips itself.
    volumes:
      - minicheck_cache:/cache
    mem_limit: 6g
    cpus: 4.0
    healthcheck:
      # python-only image (no curl/wget); /health 200 means the entailment
      # verifier is up. Fail-open still applies, but a hung minicheck now shows
      # unhealthy instead of silently degrading the entail gate (audit 2026-08-22).
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped

  # Network-isolated code-execution sidecar (audit 2026-07-08): model-written
  # Python runs HERE, in a container with no network stack at all — exfiltration
  # and SSRF against the in-network Ollama API are structurally impossible,
  # regardless of what slips past the AST screen. 2026 consensus: static
  # screens are pre-filters; the boundary must be structural.
  exec-runner:
    image: nova-app:latest
    container_name: nova-exec
    command: ["python", "-m", "app.exec_runner"]
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Fresh named volumes are root-owned; the image runs as nova (uid
      # 1000). One-time fix on a new host: docker run --rm -v
      # nova__exec_queue:/q alpine chown 1000:1000 /q
      - exec_queue:/exec_queue
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      - nova

  # Least-privilege gate in front of the docker socket (audit 2026-07-08):
  # a raw docker.sock mount is unrestricted root on the host. The proxy
  # whitelists ONLY what the watchdog needs — container list/inspect and
  # restart; exec/build/images/volumes/networks are denied by default.
  # Isolated on its own network so nova-app can never reach it.
  socket-proxy:
    # Pinned by digest 2026-08-25 (was :latest — silent-drift risk on a
    # security-boundary container). Bump deliberately, with a changelog read.
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: nova-socket-proxy
    environment:
      CONTAINERS: 1       # GET /containers/* (list + inspect/health)
      # POST=1 is the tecnativa proxy's MASTER switch for every POST endpoint —
      # LIVE-TESTED 2026-08-20: with POST=0 the watchdog's restart returns 403
      # (ALLOW_RESTARTS alone is insufficient), so POST=1 is mandatory for the
      # watchdog to recover nova-app. The cost is that POST /containers/create
      # is also reachable (returns 201) — a host-escape *primitive*, but blunted
      # because ALLOW_START is unset (default 0): a created container cannot be
      # started, so no code executes. Residual risk requires the watchdog itself
      # (static shell script, cap_drop ALL, internal-only net) to be compromised.
      POST: 1
      ALLOW_RESTARTS: 1   # /containers/{id}/restart|stop|kill
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - watchdog_net
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped

  watchdog:
    build:
      context: .
      dockerfile: Dockerfile.watchdog
    image: nova-watchdog:latest
    container_name: nova-watchdog
    # Out-of-process guardian for nova-app: restarts it on sustained-unhealthy or
    # a stale heartbeat and alerts on Discord (owner-approved 2026-07-06 after the
    # 54h silent freeze — Docker flagged unhealthy but nothing acted). Talks to
    # the docker API through socket-proxy (list+restart only) — the raw socket
    # is no longer mounted here (audit 2026-07-08).
    # Only the two Discord secrets are needed — interpolated from ./.env at parse
    # time, NOT injected as the whole env. WATCHDOG_* tuning uses the script's
    # defaults (which already match the prior behavior). Avoids handing the
    # watchdog NOVA_API_KEY + TELEGRAM_TOKEN + ~30 other vars (2026-08-14 audit).
    environment:
      WATCHDOG_DOCKER_API: http://socket-proxy:2375
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
    networks:
      - default        # Discord alerts need egress
      - watchdog_net   # docker API via the proxy
    volumes:
      # NOT :ro — WAL reads need a writable -shm; :ro would break the staleness
      # read (verified working). watchdog.sh issues SELECTs only; cap_drop ALL +
      # internal net make the rw mount a negligible write vector (2026-08-20 sweep).
      - nova_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped

  searxng:
    # Pinned by digest 2026-08-25 (was :latest — a surprise upstream change
    # to the search stack would alter research quality invisibly).
    image: searxng/searxng@sha256:11a9b34cdc0b1ec2b991470a2762ecb5a1a531898289fb51dcd015260450729e
    container_name: nova-searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      # DIRECTORY mount, deliberately not the single file: after every unclean
      # Windows shutdown, Docker Desktop's WSL2 file-share materialized
      # single-file binds as stale DIRECTORY placeholders → searxng Exited(127)
      # "not a directory" and nova-app blocked behind depends_on. That made
      # every power outage a manual runbook (compose stop → wsl --terminate
      # docker-desktop → up). Directory binds don't hit the bug — Nova now
      # boots normally after an outage (recurred 2026-08-17 and 2026-08-27;
      # this was the LAST single-file bind in the stack). The dir holds only
      # settings.yml + settings.yml.example (inert to searxng).
      - ./searxng:/etc/searxng:ro
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  exec_queue:
  ollama_data:
  embed_data:
  nova_data:
  minicheck_cache:

networks:
  default:
  watchdog_net:
    internal: true
