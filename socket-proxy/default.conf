# Docker socket allowlist for the watchdog (2026-09-01).
#
# Replaces the tecnativa proxy's POST=1 master switch, which admitted container
# delete / prune / create / exec-create through the only path that can touch
# the host daemon. The watchdog needs exactly two verbs: inspect three named
# containers, and restart them. Everything else is 403.
#
# Mounted as a DIRECTORY (./socket-proxy -> /etc/nginx/conf.d) — single-file
# bind mounts turn into stale directory placeholders after an unclean Windows
# shutdown (runbook 2026-08-17).

upstream docker {
    server unix:/var/run/docker.sock;
}

server {
    listen 2375;
    access_log /dev/stdout;

    # GET /containers/{nova-app|nova-ollama|nova-embed}/json  — health/inspect
    location ~ ^/(v[0-9.]+/)?containers/(nova-app|nova-ollama|nova-embed)/json$ {
        limit_except GET { deny all; }
        proxy_pass http://docker;
        proxy_set_header Host localhost;
    }

    # POST /containers/{nova-app|nova-ollama|nova-embed}/restart — the recovery verb
    location ~ ^/(v[0-9.]+/)?containers/(nova-app|nova-ollama|nova-embed)/restart$ {
        limit_except POST { deny all; }
        proxy_pass http://docker;
        proxy_set_header Host localhost;
        proxy_read_timeout 120s;
    }

    location / {
        return 403;
    }
}
